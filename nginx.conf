events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, this
    # forces nginx to re-resolve upstream container names at request time instead
    # of caching the IP once at startup. Without this, Watchtower recreating the
    # api/web containers gives them new IPs and nginx keeps hitting the old ones
    # (502 Bad Gateway) until it is manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Frontend
    server {
        listen 80;
        server_name localhost;

        # API on the same origin so the browser can reach the backend without
        # extra ports/CORS. /api/v1/... -> api:3000/api/v1/...
        location /api/ {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $web_upstream http://web:8080;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # API
    server {
        listen 3000;
        server_name localhost;

        # Lightweight endpoint for the container healthcheck so Docker can detect
        # and auto-restart a wedged nginx (see docker-compose.prod.yml).
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
