# SucheWohnung — Docker Compose (dev/staging) (§14.2)

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgresql://app:app@postgres:5432/suchewohnung?schema=public
  REDIS_URL: redis://redis:6379
  API_BASE_URL: http://api:3000
  WEB_BASE_URL: http://localhost
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_USERNAME: SucheWohnungBot
  TELEGRAM_USE_WEBHOOK: "false"
  TELEGRAM_WEBHOOK_URL: ""
  TELEGRAM_WEBHOOK_SECRET: ""
  SMTP_URL: ""
  EMAIL_FROM: no-reply@suchewohnung.de

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: suchewohnung
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-smoke:
    profiles: ["smoke"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: suchewohnung_smoke
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d suchewohnung_smoke"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-smoke:
    profiles: ["smoke"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-collect:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/collect.js"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-match:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/match.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-notify:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/notify.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-auto-reply:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/auto-reply.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  scheduler:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/scheduler.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        # Baked into the bundle at build time (Next.js inlines NEXT_PUBLIC_*).
        # Same-origin relative base; nginx proxies /api/ -> api:3000.
        NEXT_PUBLIC_API_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  kleinanzeigen-api:
    image: ghcr.io/danielwte/ebay-kleinanzeigen-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      HEADLESS: "true"

  immo-api:
    build:
      context: ./services/immo-api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Observability: Prometheus scrapes api + worker-collect and evaluates the
  # source-health alert rules; Alertmanager routes any firing alerts (§15.3).
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
