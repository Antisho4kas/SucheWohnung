# SucheWohnung — Docker Compose (dev/staging) (§14.2)

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: suchewohnung
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-collect:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/collect.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-match:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/match.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-notify:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/notify.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  scheduler:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: ["node", "dist/workers/scheduler.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-app}@postgres:5432/suchewohnung?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    env_file: .env
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  kleinanzeigen-api:
    image: ghcr.io/danielwte/ebay-kleinanzeigen-api:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      HEADLESS: "true"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
