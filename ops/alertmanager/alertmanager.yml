# Alertmanager configuration (§15.3)
# Minimal, valid config so Alertmanager starts. All source-health alerts route
# to the single `default` receiver.
#
# TODO: configure a real contact point (Telegram/Slack/email) here.
# Examples (uncomment and fill in, then point the default route at it):
#
#   receivers:
#     - name: default
#       slack_configs:
#         - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
#           channel: '#alerts'
#     - name: default
#       webhook_configs:               # e.g. a Telegram-bridge webhook
#         - url: 'http://your-telegram-bridge:8080/alert'

route:
  receiver: default
  group_by: ['alertname', 'source']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Placeholder receiver. Kept as a no-op webhook so Alertmanager boots cleanly.
  # Replace with a real contact point (see the commented examples above).
  - name: default
    webhook_configs:
      - url: 'http://localhost:9093/'
        send_resolved: true
